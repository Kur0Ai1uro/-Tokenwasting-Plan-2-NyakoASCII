<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nyako ASCII</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <img class="paw paw-tl" src="../assets/paw-print.svg" alt="">
  <img class="paw paw-tr" src="../assets/paw-print.svg" alt="">
  <img class="paw paw-bl" src="../assets/paw-print.svg" alt="">
  <img class="paw paw-br" src="../assets/paw-print.svg" alt="">

  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="../assets/cat-face.svg" alt="">
      <h1>Nyako ASCII</h1>
    </div>
    <div class="switch" id="mode-switch" role="tablist">
      <span class="switch-thumb" aria-hidden="true"></span>
      <button type="button" class="is-on" data-mode="image"><span class="icon icon-image" aria-hidden="true"></span>图片</button>
      <button type="button" data-mode="text"><span class="icon icon-type" aria-hidden="true"></span>文字</button>
    </div>
    <div class="switch switch-theme" id="theme-switch">
      <span class="switch-thumb" aria-hidden="true"></span>
      <button type="button" class="is-on" data-theme="light"><span class="icon icon-sun" aria-hidden="true"></span>浅色</button>
      <button type="button" data-theme="dark"><span class="icon icon-moon" aria-hidden="true"></span>深色</button>
    </div>
  </header>

  <main class="workspace">
    <section class="card controls">
      <div data-panel="image">
        <button type="button" class="btn wide" id="open-image">
          <span class="icon icon-paw" aria-hidden="true"></span>
          选择图片
        </button>
        <p class="filename" id="filename">未选择图片</p>
      </div>

      <div data-panel="text" hidden>
        <label class="field-label" for="source">输入文字</label>
        <textarea id="source" rows="6" spellcheck="false"></textarea>

        <label class="field-label" for="font-filter">字体</label>
        <input id="font-filter" type="search" placeholder="筛选字体" autocomplete="off">
        <div class="font-list" id="font-list" role="listbox" aria-label="字体"></div>

        <label class="field-label" for="space">字间距：<span id="space-value">0</span></label>
        <input id="space" type="range" min="0" max="2" step="1" value="0">

        <label class="field-label" for="decoration">装饰</label>
        <select id="decoration"></select>
      </div>

      <div data-panel="image" class="tune">
        <p class="section-title">调节</p>
        <label class="field-label" for="columns">输出宽度：<span id="columns-value">100</span></label>
        <input id="columns" type="range" min="20" max="300" step="1" value="100">

        <label class="field-label" for="brightness">亮度：<span id="brightness-value">1.00</span></label>
        <input id="brightness" type="range" min="0.2" max="2" step="0.01" value="1">

        <label class="field-label" for="contrast">对比度：<span id="contrast-value">1.00</span></label>
        <input id="contrast" type="range" min="0.2" max="2" step="0.01" value="1">

        <label class="field-label" for="aspect">字符宽高比：<span id="aspect-value">0.50</span></label>
        <input id="aspect" type="range" min="0.25" max="1" step="0.01" value="0.5">

        <label class="field-label" for="preset">字符集</label>
        <select id="preset"></select>

        <label class="field-label" for="charset">自定义字符集</label>
        <input id="charset" type="text" placeholder="留空则用预设，左暗右亮" autocomplete="off">

        <label class="check"><input id="invert" type="checkbox"> 反色</label>
      </div>
    </section>

    <section class="card preview-card">
      <div class="preview-head">
        <span>预览</span>
        <img class="sleeper" src="../assets/sleeping-cat.svg" alt="">
      </div>
      <pre id="preview" class="is-empty">选择一张图片，开始转成 ASCII</pre>
    </section>
  </main>

  <footer class="bottom">
    <button type="button" class="btn" id="copy" disabled>
      <span class="icon icon-paw" aria-hidden="true"></span>
      复制
    </button>
    <button type="button" class="btn" id="save" disabled>
      <span class="icon icon-cat" aria-hidden="true"></span>
      保存 txt
    </button>
    <p class="status" id="status"></p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
